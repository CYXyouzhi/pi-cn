name: Publish to npm

# 为什么用 Actions 发布：本机网络无法直连 registry.npmjs.org（Cloudflare IP 全超时），
# GitHub 的 runner 可以，所以把发布动作交给它。
#
# 触发方式：
#   1. 推送 v* tag（推荐，会校验 tag 与 package.json 版本一致）
#   2. 手动触发（workflow_dispatch，不校验版本）
#
# 前置：仓库 Settings → Secrets and variables → Actions 里配置 NPM_TOKEN

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # 防止「改了代码没改 version」或「tag 名写错」导致发布到错误版本号
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json: $PKG / tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致，已中止发布"
            exit 1
          fi
          echo "版本一致，继续发布"

      - name: 发布到 npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
